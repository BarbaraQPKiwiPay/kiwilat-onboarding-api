# Configuracion para entorno de desarrollo
#spring.datasource.url=jdbc:postgresql://localhost:5432/kiwi_dev
#spring.datasource.username=dev_user
#spring.datasource.password=dev_pass
#spring.jpa.hibernate.ddl-auto=update
#logging.level.root=DEBUG
spring.datasource.url=jdbc:postgresql://localhost:5433/OnboardingDB
spring.datasource.username=postgres
spring.jpa.hibernate.ddl-auto=update
spring.datasource.password=123456789
logging.level.root=DEBUG

# ==========================================
# JPA/Hibernate Configuration
# ==========================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
server.port=8080

# ==========================================
# Server Configuration
# ==========================================
#server.port=8081

# ==========================================
# JWT Configuration
# ==========================================
jwt.secret=mySecretKeyForJWTTokenGenerationThatIsLongEnoughForHS256Algorithm
jwt.expiration=86400000

# ==========================================
# Swagger/OpenAPI Configuration
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.show-actuator=false

# ==========================================
# Logging Configuration
# ==========================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.loantrack=INFO
logging.level.org.springframework.security=DEBUG

